<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logos/glyph.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/logos/glyph-on-dark.svg" media="(prefers-color-scheme: dark)" />
    <title>Arctuition Design System</title>
    <script>
      // Apply persisted theme before the React bundle boots — prevents a
      // flash of the wrong palette while the JS is parsing. Mirrors
      // `themeInitScript` in src/app/store/theme.ts; keep the storage key
      // in sync if either side changes.
      (function () {
        try {
          var v = localStorage.getItem('ds-theme-mode');
          var mode = (v === 'light' || v === 'dark' || v === 'system') ? v : 'system';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (_) {}
      })();
    </script>
    <style>
      /* Initial loader shown before the JS bundle parses. React replaces
         #root's contents on first render, so this is automatically removed.
         Hex values mirror tokens-color.md global primitives — the bundle
         hasn't loaded yet, so CSS variables aren't available here. */
      html, body { margin: 0; padding: 0; background: #FFFFFF; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #262626; }
      }
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .initial-loader__spinner {
        width: 32px;
        height: 32px;
        border: 2px solid #E3571C;
        border-top-color: transparent;
        border-radius: 50%;
        animation: initial-loader-spin 0.8s linear infinite;
      }
      @keyframes initial-loader-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="initial-loader" aria-label="Loading">
        <div class="initial-loader__spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
